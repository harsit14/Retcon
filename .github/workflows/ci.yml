name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNS_DIR: /tmp/retcon-runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install small; the training tests use tiny
          # randomly initialized models and never download weights.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[data,tokenization,training,dev]"
      - name: Lint
        run: ruff check .
      - name: Validate configs
        run: python scripts/validate_configs.py
      - name: Unit tests
        run: python -m pytest
      - name: Tiny smoke pipeline
        run: |
          retcon init --config configs/smoke_qwen_0_6b.yaml --run-id ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage eval_design --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage ingest --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage clean --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage dedup --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage contamination --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon prepare --stage tokenize --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon eval --target base --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon eval --target reliability --run ci-smoke --runs-dir "$RUNS_DIR"
          retcon report --run ci-smoke --runs-dir "$RUNS_DIR"
